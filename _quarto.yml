# sonify-viz public site (Quarto website). GitHub Actions renders it and
# deploys to Pages (.github/workflows/publish.yml); _site/ is not committed.
# Source lives in the vault (site/); scripts/publish_site.sh syncs it, with the
# symlinks listen -> ../listen, scripts -> ../scripts and figs -> ../figs
# resolved, into the git checkout in runtime. Git can't live in the vault.
project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - water-year.qmd
    - listen.qmd
    - methods.qmd
    - climate.qmd
    - meridian.qmd
    - superior-ice.qmd
    - regimes.qmd
    - tracks.qmd
    - glossary.qmd
    - about.qmd
    - accessibility.qmd
  resources:
    - listen/index.html
    # listed one by one: Quarto doesn't expand wildcards inside symlinked folders
    - listen/granby_wy2024.json
    - listen/granby_wy2024.mp3
    - listen/okanagan_wy2024.json
    - listen/okanagan_wy2024.mp3
    - figs/granby_wy2024_check.png
    - figs/okanagan_wy2024_check.png
    - figs/climate_pacific_1958_2025_check.png
    - figs/climate_atlantic_1958_2025_check.png
    - audio/*
    - climate/viz.js
    - climate/viz_pacific.json
    - climate/viz_atlantic.json
    - listen/fonts/*
    - .nojekyll
    - dictionary/*.html
    - meridian/index.html
    - meridian/meridian_ds2023__layer2-wide-long.json
    - meridian/meridian_ds2023__layer2-wide-long.mp3
    - meridian/meridian_ds2023.json
    - meridian/meridian_ds2023.mp3
    - superior-ice/*
    - superior-ice/days/*
    - flow-regimes/index.html
    - flow-regimes/bside_regimes.mp3
    - flow-regimes/bside_score.json
    - shared/*

website:
  title: "sonify-viz"
  description: "Environmental data as music: a learning workbench for data sonification."
  site-url: "https://cordilleran.github.io/sonify-viz/"
  repo-url: "https://github.com/cordilleran/sonify-viz"
  repo-actions: [source, issue]
  page-navigation: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - text: Water Year Rings
        menu:
          - href: water-year.qmd
            text: The pieces
          - href: listen.qmd
            text: Listen with the visual
          - href: methods.qmd
            text: Methods & code
      - href: climate.qmd
        text: Climate Pair
      - href: meridian.qmd
        text: Meridian Chorus
      - href: superior-ice.qmd
        text: Superior Ice
      - href: regimes.qmd
        text: Flow Regimes
      - href: tracks.qmd
        text: Tracks
      - href: glossary.qmd
        text: Glossary
      - href: about.qmd
        text: How this was made
    right:
      - icon: github
        href: https://github.com/cordilleran/sonify-viz
        aria-label: Source code on GitHub
  page-footer:
    left: "Graham Watt & Claude Code · [how this was made](about.qmd) · [accessibility](accessibility.qmd) · [source on GitHub](https://github.com/cordilleran/sonify-viz)"
    right: "Code MPL 2.0 · audio: see each piece · data per source"

format:
  html:
    theme: [darkly, styles.scss]
    highlight-style: nord
    toc: true
    toc-depth: 2
    smooth-scroll: true
    code-copy: true
    link-external-newwindow: true
    include-in-header:
      text: '<link rel="stylesheet" href="listen/fonts/fonts.css">'
