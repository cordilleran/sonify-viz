$version: 0.1.0
$learn_more: https://data-dict.tidyverse.org/

name: climate-pair-records
label: Climate Pair records
description: >
  The records behind the Climate Pair (Pacific and Atlantic), 1958-2025:
  monthly global climate indices, every tropical cyclone in three ocean
  basins, the four volcanic eruptions the pieces mark, and the Kettle
  River's peak flow each year. Values are copied from what the agencies
  published after parsing, not transformed; the pieces transform them in
  code (scripts/climate_pair.py) and the Climate Pair page says how.
details: >
  Built by scripts/build_parquet.py from the parsed files
  scripts/fetch_climate.py writes to data/climate/*.json, which are kept
  beside it. The raw downloads (data/climate/raw/) are not republished; their
  source addresses are listed under each table. Two series the pieces also
  play are not redistributed at all: SILSO sunspot numbers (CC BY-NC 4.0)
  and IAP ocean heat content (redistribution terms not yet confirmed). They
  are fetched by fetch_climate.py and described in
  fetched-only.data-dict.yaml; the site shows them only as loudness.
origin: ../../../scripts/build_parquet.py
version:
  date: 2026-09-27

tables:
  - name: indices_monthly
    label: Monthly climate indices
    description: >
      One row per calendar month, January 1958 to December 2025: the
      Keeling curve, ENSO, the Pacific and Atlantic multidecadal indices,
      the North Atlantic Oscillation, global ocean and land-ocean
      temperature, and Arctic sea ice.
    details: >
      Sources: NOAA GML Mauna Loa (gml.noaa.gov/ccgg/trends); NOAA CPC ONI
      and NAO; NOAA NCEI ERSSTv5 PDO and Climate at a Glance; NOAA PSL AMO
      (Kaplan SST v2); NASA GISS GISTEMP v4; NSIDC Sea Ice Index v4
      (G02135). An empty cell is a month the source doesn't cover. The
      pieces fill interior gaps by linear interpolation and hold the
      nearest value at the ends.
    source:
      parquet: indices_monthly.parquet
    columns:
      - name: month
        type: date
        constraints: [primary_key]
        description: First day of the calendar month the values describe.
        range: [1958-01-01, 2025-12-01]
      - name: co2_ppm
        type: number(quantity)
        units: ppm (µmol per mol of dry air)
        description: >
          Monthly mean atmospheric CO2 at Mauna Loa, Hawaii (the Keeling
          curve), March 1958 on. From December 2022 to early July 2023 the
          measurements come from Maunakea, about 21 miles north, after the
          Mauna Loa eruption. NOAA interpolates missing months.
        range: [312.42, 430.51]
      - name: co2_deseason_ppm
        type: number(quantity)
        units: ppm (µmol per mol of dry air)
        description: >
          The same series with NOAA's average seasonal cycle removed. The
          Climate Pair's drone follows this; the difference between the two
          columns (the biosphere's yearly breath) makes it swell and fade.
        range: [314.44, 428.42]
      - name: oni
        type: number(quantity)
        units: °C
        description: >
          Oceanic Niño Index: the three-month running mean of sea-surface
          temperature anomaly in the Niño 3.4 region (ERSSTv5), against
          centred 30-year base periods. Each three-month season is stored at
          its centre month (DJF at January). +0.5 or above is El Niño
          territory, -0.5 or below La Niña.
        range: [-2.04, 2.59]
      - name: pdo
        type: number(quantity)
        units: standardized index (no unit)
        description: Pacific Decadal Oscillation, NOAA NCEI, from ERSSTv5. Positive is the warm phase.
        range: [-4.21, 2.55]
      - name: amo
        type: number(quantity)
        units: °C
        description: >
          Atlantic Multidecadal Oscillation, unsmoothed, long version, from
          NOAA PSL (Kaplan SST v2). The series ends in January 2023, so
          February 2023 onward is empty; the Atlantic piece holds the last
          value to the end.
        range: [-0.536, 0.662]
      - name: nao
        type: number(quantity)
        units: standardized index (no unit)
        description: North Atlantic Oscillation, NOAA CPC, monthly. Positive means stronger westerlies and stormier winters in northern Europe.
        range: [-3.18, 3.04]
      - name: sst_global_anom
        type: number(quantity)
        units: °C
        description: Global ocean surface temperature departure from the 1901-2000 average, NOAA NCEI Climate at a Glance.
        range: [-0.25, 1.03]
      - name: gistemp_anom
        type: number(quantity)
        units: °C
        description: Global land-ocean surface temperature anomaly, NASA GISS GISTEMP v4, against 1951-1980.
        range: [-0.35, 1.48]
      - name: seaice_extent_mkm2
        type: number(quantity)
        units: million km²
        description: >
          Arctic sea-ice extent: the area of ocean with at least 15% ice
          cover, monthly mean, from satellite passive microwave. The record
          begins November 1978; December 1987 and January 1988 are missing
          (a satellite gap).
        range: [3.57, 16.34]

  - name: storms
    label: Tropical cyclones
    description: >
      One row per tropical cyclone that peaked in 1958-2025 in three basins:
      the Atlantic, the Northeast and Central Pacific, and the West Pacific.
      Each storm is reduced to a few numbers from its best track: peak wind
      and when it happened, category, accumulated energy, whether it made
      landfall, and lowest pressure.
    details: >
      Atlantic and Northeast/Central Pacific: NOAA NHC HURDAT2
      (www.nhc.noaa.gov/data/hurdat). West Pacific: NOAA NCEI IBTrACS
      v04r01, using USA_WIND (JTWC, 1-minute sustained) so the categories
      match HURDAT2's scale. Counts before satellite coverage (about the
      mid-1960s) miss short-lived storms far from land; treat early decades
      as undercounts. Landfall is defined differently in the two sources
      (see the landfall column).
    source:
      parquet: storms.parquet
    columns:
      - name: basin
        type: enum
        constraints: [required]
        values:
          atl: North Atlantic (HURDAT2)
          nepac: Northeast and Central Pacific (HURDAT2)
          wpac: West Pacific (IBTrACS)
      - name: id
        type: string
        constraints: [required]
        description: The source's storm identifier (HURDAT2's AL011958; IBTrACS's SID).
        examples: [AL011958, EP021958, 1958007N03171]
      - name: name
        type: string
        constraints: [required]
        description: The storm's name as the source gives it, in title case; unnamed storms read "Unnamed" (HURDAT2) or "Not_Named" (IBTrACS).
        examples: [Alma, Melissa, Unnamed, Pabuk]
      - name: peak_kt
        type: number(quantity)
        units: knots (1-minute sustained wind)
        constraints: [required]
        description: The highest wind in the storm's track.
        range: [15, 185]
      - name: peak_time
        type: datetime
        time_zone: UTC
        constraints: [required]
        description: The time (UTC) of the first track point at peak wind. The pieces place the storm here.
        range: [1958-01-13T00:00:00, 2025-10-28T12:00:00]
      - name: category
        type: number(ordinal)
        constraints:
          - required
          - assert: >
              category = CASE WHEN peak_kt >= 137 THEN 5 WHEN peak_kt >= 113 THEN 4
              WHEN peak_kt >= 96 THEN 3 WHEN peak_kt >= 83 THEN 2 WHEN peak_kt >= 64 THEN 1 ELSE 0 END
            description: The category is derived from peak_kt by the Saffir-Simpson thresholds.
        description: >
          Saffir-Simpson category from peak_kt: 1 from 64 kt, 2 from 83, 3
          from 96, 4 from 113, 5 from 137; 0 is below hurricane strength
          (tropical depression or storm). Derived by fetch_climate.py, not
          the agency's own label.
        range: [0, 5]
      - name: ace
        type: number(quantity)
        units: 10⁴ kt²
        constraints:
          - required
          - assert: ace >= 0
        description: >
          Accumulated cyclone energy: the sum of the squared wind, divided
          by 10,000, at the four synoptic times each day (00, 06, 12, 18
          UTC) while the storm is at least tropical-storm strength (34 kt).
          HURDAT2 storms count tropical, hurricane and subtropical points;
          IBTrACS storms count points marked tropical. Derived by
          fetch_climate.py.
        range: [0, 85.26]
      - name: landfall
        type: boolean
        constraints: [required]
        description: >
          HURDAT2: the track has a landfall record (L), including small
          islands. IBTrACS: a track point at 34 kt or more lies over land
          (distance to land 0). The IBTrACS rule counts more storms, so the
          basins' landfall rates don't compare directly.
      - name: min_pressure_mb
        type: number(quantity)
        units: hPa (mb)
        description: >
          The lowest central pressure on the track. Often empty, especially
          in the West Pacific (1,271 of 1,965 storms) and before the 1970s.
          The pieces don't use it.
        range: [872, 1016]

  - name: volcanoes
    label: Volcanic eruptions the pieces mark
    description: >
      The four large eruptions of 1958-2025 that the Climate Pair sounds: a
      gong at the eruption, and a darkening of the drone as the aerosols
      cool the planet.
    details: >
      The list and the cooling weights were chosen for the pieces, not taken
      from a catalogue: four eruptions of 1958-2025 with a Volcanic
      Explosivity Index of 5 or more, weighted by how much each is thought
      to have cooled the planet.
    source:
      parquet: volcanoes.parquet
    columns:
      - name: date
        type: date
        constraints: [primary_key]
        description: The date of the main eruption.
        range: [1963-03-17, 2022-01-15]
      - name: name
        type: string
        constraints: [required]
        examples: ["Agung, Bali", "El Chichon, Mexico", "Pinatubo, Philippines", "Hunga Tonga-Hunga Ha'apai"]
      - name: vei
        type: number(ordinal)
        constraints: [required]
        description: Volcanic Explosivity Index, a logarithmic scale of erupted volume.
        range: [5, 6]
      - name: cooling
        type: number(quantity)
        units: 0 to 1 (the piece's own scale)
        constraints: [required]
        description: >
          How far the drone darkens, set by hand for the piece (derived, not
          measured): 0.6 for Pinatubo, 0.4 for Agung and El Chichón, 0.1
          for Hunga Tonga, which injected mostly water vapour rather than
          sulphate. The darkening decays with an e-folding time of 14 months.
        range: [0.1, 0.6]
      - name: note
        type: string
        description: A note on an eruption that behaves differently; empty for the others.
        examples: ["mostly water vapour, not sulphate: the drone barely darkens"]

  - name: kettle_annual_peak
    label: Kettle River annual peak flow
    description: >
      One row per calendar year: the highest daily mean flow of the Kettle
      River near Laurier, Washington (USGS 12404500), and its date. The
      Pacific piece plays each spring peak as a harp and piano bloom sized
      by its rank.
    details: >
      Computed by fetch_climate.py from the USGS daily record (1929-09-01
      to 2026-08-08). The first and last years are partial: 1929 starts in
      September, so its "peak" is a November value, and 2026 stops in August.
      The pieces use 1958-2025 only. The Kettle replaced the Granby here
      because the Granby's record has a gap from 1958 to 1966.
    source:
      parquet: kettle_annual_peak.parquet
    columns:
      - name: year
        type: number(ordinal)
        constraints: [primary_key]
        range: [1929, 2026]
      - name: max_daily_m3s
        type: number(quantity)
        units: m³/s
        constraints: [required]
        description: The year's highest daily mean discharge (USGS publishes cubic feet per second; converted).
        range: [7.645536, 1316.7312]
      - name: date
        type: date
        constraints: [required]
        description: The day of that peak (the first, if tied).
        range: [1929-11-04, 2026-05-08]

glossary:
  ENSO: El Niño-Southern Oscillation, the Pacific's two-to-seven-year swing between warm (El Niño) and cool (La Niña) states.
  ONI: Oceanic Niño Index, NOAA's standard measure of ENSO.
  PDO: Pacific Decadal Oscillation, a slow pattern of North Pacific sea-surface temperature that shifts every decade or two.
  AMO: Atlantic Multidecadal Oscillation, a slow swing in North Atlantic sea-surface temperature over several decades.
  NAO: North Atlantic Oscillation, the see-saw of air pressure between Iceland and the Azores.
  anomaly: The difference between a value and the average for a reference period.
  best track: An agency's after-the-fact record of a storm's position and strength every six hours.
  ACE: Accumulated cyclone energy, a measure of a storm's (or a season's) combined strength and duration.
  Saffir-Simpson scale: The five hurricane categories, by 1-minute sustained wind.
  sea-ice extent: The area of ocean with at least 15% ice cover.
  VEI: Volcanic Explosivity Index.
  Keeling curve: The record of atmospheric CO2 at Mauna Loa, begun by Charles David Keeling in 1958.
