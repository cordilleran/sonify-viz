<!doctype html>
<html lang="en"><meta charset="utf-8"><title>iframe test wrapper</title>
<!-- Mimics the site's wrapper pages (superior-ice.qmd): the piece in an iframe with ?embed, resized by postMessage. Use ?p=superior-ice|meridian|listen -->
<h1>Wrapper</h1>
<iframe id="f" style="width:100%;height:1400px;border:0" title="piece"></iframe>
<script>
const p=new URLSearchParams(location.search).get('p');
const f=document.getElementById('f');f.src='/'+p+'/index.html?embed';
addEventListener('message',e=>{if(e.source===f.contentWindow&&e.data&&typeof e.data.wyrHeight==='number')f.style.height=(e.data.wyrHeight+8)+'px'});
</script>
