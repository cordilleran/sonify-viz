# Albums: named groupings of tracks, each with its page on the site.
- id: water-year
  title: Water Year Rings
  page: water-year.qmd
  about: One hydrologic year in two southern British Columbia watersheds, on recorded acoustic instruments.
  tracks: [granby-wy2024, okanagan-wy2024]
- id: climate-pair
  title: Climate Pair
  page: climate.qmd
  about: Sixty-eight years of the global climate record, one year per bar, heard from the Pacific and from the Atlantic.
  tracks: [climate-pair-pacific, climate-pair-atlantic]
- id: meridian
  title: Meridian Chorus
  page: meridian.qmd
  about: Thirteen voices on the 100th meridian west, pole to pole, singing one year of daylight, air, sea and ice.
  tracks: [meridian-layer2-wide-long, meridian-daylight]
- id: superior-ice
  title: Superior Ice Year
  page: superior-ice.qmd
  about: One winter of ice on Lake Superior, 2025-26, heard region by region from west to east.
  tracks: [superior-ice, superior-ice-short]
- id: flow-regimes
  title: Flow Regimes
  page: regimes.qmd
  about: Four very different water years of interior British Columbia, each a drum voice, entering one at a time.
  tracks: [regimes-bside]
- id: arctic-round
  title: Arctic Round
  page: arctic-round.qmd
  about: Forty-eight years of Arctic sea ice, one ice year per bar, as a set of pieces. The Wheel, a variant, is published first; the Round, the main piece, is in preparation.
  tracks: [arctic-wheel]
- id: godbout
  title: Godbout Outlook
  page: godbout.qmd
  about: A 15-day weather forecast for Godbout, Quebec, one bar for every six hours, played as a groove.
  tracks: [godbout-village]
- id: lightning
  title: "2424/461"
  page: lightning.qmd
  about: 2,424 lightning flashes over 461 minutes in the Cariboo and Chilcotin, 30 June to 1 July 2021, heard from a pin you can move.
  tracks: []
