$version: 0.1.0
$learn_more: https://data-dict.tidyverse.org/
name: meridian-layer2-wide-long-mapping
label: Meridian Chorus, light, air, sea and ice - mapping
description: >-
  How Meridian Chorus turns one year of sunlight on the 100th meridian west into music: thirteen voices, one every
  15 degrees from the North Pole to the South Pole, sing from the December 2023 solstice to the December 2024 solstice.
  Three days per breath of 8 seconds, in four movements; air, sea and ice join the sunlight.
details: >-
  Copied by scripts/export_mapping.py from the score of the locked render (renders.lock.json), and only if its SHA-256
  matches the lock. The values are the piece's own (scripts/meridian.py, scripts/solar.py). Sunlight is computed
  from solar geometry, not measured (D). Air, sea and ice are read at one cell per voice.
origin: ../../../scripts/export_mapping.py
version:
  number: 0.1.0
tables:
- name: voices
  label: The thirteen voices
  description: "One row per voice: the 13 latitudes on 100 degrees W from the North Pole to the South Pole, with the surface under each, its pitch, and the pitch of its sea voice where it has one."
  source:
    parquet: voices.parquet
  columns:
  - name: lat
    type: number(id)
    range: [-90, 90]
    constraints:
    - primary_key
    description: >-
      Latitude on 100 degrees W in degrees north, every 15 degrees, pole to pole.
    examples:
    - -90
    - -75
    - -60
    - -45
    - -30
    - -15
    - 0
    - 15
    - 30
    - 45
    - 60
    - 75
    - 90
  - name: place
    type: string
    description: "The place under the voice, from the North Pole to the South Pole, for example Edwards Plateau, Texas."
    examples:
    - Bathurst Island, Nunavut
    - Edwards Plateau, Texas
    - Equatorial Pacific, cold tongue
  - name: surface
    type: enum
    description: What lies under the voice; sets which layers it carries.
    values:
      ice sheet: ice sheet
      land: land
      land, sea ice: land, sea ice
      ocean: ocean
      ocean, sea ice: ocean, sea ice
      sea ice: sea ice
  - name: midi
    type: number(ordinal)
    description: The voice's pitch as a MIDI note (60 is middle C); north highest.
    range:
    - 62
    - 93
  - name: sea_midi
    type: number(ordinal)
    description: >-
      The sea voice's pitch on the sea floor, where the voice has a sea. Empty in 5 of 13 rows.
    range:
    - 26
    - 57
- name: voice_breaths
  label: What each voice read, each breath
  description: >-
    One row per voice per breath. A voice at the pole in its winter has no sunrise or sunset; those cells are empty.
  source:
    parquet: voice_breaths.parquet
  columns:
  - name: breath
    type: number(ordinal)
    constraints:
    - required
    description: The breath, from 0; each breath is one step of the year.
    range:
    - 0
    - 121
  - name: t
    type: number(quantity)
    units: seconds
    constraints:
    - required
    description: When the breath starts in the audio.
    range:
    - 0.0
    - 968.0
  - name: date
    type: date
    constraints:
    - required
    description: The date the breath stands for.
    range:
    - 2023-12-23
    - 2024-12-20
  - name: lat
    type: number(id)
    range: [-90, 90]
    constraints:
    - required
    - foreign_key
    description: 'The voice: its latitude on 100 degrees W, in degrees north.'
    examples:
    - -90
    - -75
    - -60
    - -45
    - -30
    - -15
    - 0
    - 15
    - 30
    - 45
    - 60
    - 75
    - 90
  - name: daylength_h
    type: number(quantity)
    units: hours
    description: >-
      Hours of sun above the horizon (D, from solar geometry). The voice sounds while its sun is up.
    range:
    - 0.0
    - 24.0
  - name: twilight_h
    type: number(quantity)
    units: hours
    description: >-
      Hours of civil twilight (D). The note swells in and fades out through it, at up to 30 % level.
    range:
    - 0.0
    - 12.0
  - name: sunrise_solar_h
    type: number(quantity)
    units: hours
    description: >-
      Sunrise in local solar time (D); every voice shares one noon. Empty in 378 of 1586 rows.
    range:
    - 0.411
    - 11.45
  - name: sunset_solar_h
    type: number(quantity)
    units: hours
    description: >-
      Sunset in local solar time (D). Empty in 378 of 1586 rows.
    range:
    - 12.55
    - 23.589
  - name: noon_altitude_deg
    type: number(quantity)
    units: degrees
    description: The sun's height at noon (D).
    range:
    - -23.44
    - 89.99
  - name: air_max_c
    type: number(quantity)
    units: degrees C
    description: >-
      Daily maximum air temperature, averaged over the breath's days (D: ERA5 reanalysis via Open-Meteo, CC BY 4.0).
      Colours the organ by day.
    range:
    - -58.5
    - 38.3
  - name: air_min_c
    type: number(quantity)
    units: degrees C
    description: >-
      Daily minimum air temperature, averaged the same way (D: ERA5). Colours the organ by night.
    range:
    - -62.7
    - 30.0
  - name: sst_c
    type: number(quantity)
    units: degrees C
    description: >-
      Sea surface temperature at the voice's ocean cell (R, NOAA OISST v2.1); empty for land voices. The sea sings
      on its own floor, warmest highest. Empty in 488 of 1586 rows.
    range:
    - -1.8
    - 31.44
  - name: ice_frac
    type: number(quantity)
    units: "0 to 1 (fraction covered)"
    description: >-
      Sea ice concentration, 0 to 1 (R, NOAA/NSIDC sea ice CDR v6); empty where there is no sea. Ice quiets the
      sea voice. Empty in 1098 of 1586 rows.
    range:
    - 0.0
    - 1.0
  - name: warmth_day
    type: number(quantity)
    units: "0 to 1 (position on a fixed scale)"
    description: >-
      The organ's day warmth, 0 to 1: the day air on a fixed scale from -40 to 35 degrees C (D).
    range:
    - 0.0
    - 1.0
  - name: warmth_night
    type: number(quantity)
    units: "0 to 1 (position on a fixed scale)"
    description: The organ's night warmth, 0 to 1, from the night air (D).
    range:
    - 0.0
    - 0.933
relationships:
- join: voice_breaths.lat = voices.lat
  cardinality: many-to-one
  description: Each voice has one row per breath.
